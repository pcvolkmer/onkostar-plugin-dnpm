plugins {
    id 'java'
    id 'jacoco'
    id("com.gradleup.shadow") version "8.3.8"
    id("com.diffplug.spotless") version "7.2.1"
}

group = 'DNPMHelper'
version = '2.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    mavenCentral()
}

ext {
    springVersion = '4.3.8.RELEASE'
    springSecurityVersion = '4.2.2.RELEASE'

    junit5Version = '5.13.3'
    assertjVersion = '3.27.3'
    mockitoVersion = '5.17.0'
}

dependencies {
    implementation files('libs/onkostar-api-2.14.0.jar')

    implementation 'org.jspecify:jspecify:1.0.0'

    implementation 'org.hibernate:hibernate-core:4.3.11.Final'
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework.security:spring-security-core:${springSecurityVersion}"
    implementation 'org.springframework.data:spring-data-jpa:1.2.0.RELEASE'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.2'
    implementation 'org.slf4j:slf4j-api:1.7.2'
    implementation 'javax.xml.bind:jaxb-api:2.3.0'
    implementation 'org.apache.commons:commons-csv:1.2'
    implementation 'commons-lang:commons-lang:2.6'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.3'

    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junit5Version}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junit5Version}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testImplementation 'org.aspectj:aspectjweaver:1.7.1'
    testImplementation 'ca.uhn.hapi:hapi-base:2.3'
    testImplementation 'ca.uhn.hapi:hapi-structures-v26:2.3'
    testImplementation 'log4j:log4j:1.2.17'
    testImplementation 'org.apache.commons:commons-lang3:3.1'
}

compileJava {
    options.encoding = 'UTF-8'
}

processResources {
    filteringCharset = 'UTF-8'
}

test {
    useJUnitPlatform()
    dependsOn(tasks.spotlessCheck)
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
    }
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
    }
}